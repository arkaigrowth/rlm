[project]
name = "rlm"
version = "0.3.0"
description = "Recursive Language Model MCP server that handles 10M+ token contexts by treating them as external variables. Based on MIT research (arxiv 2512.24601)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Alex Kamysz", email = "alex@arkaigrowth.com"},
]
keywords = ["mcp", "llm", "recursive", "context", "claude", "ai", "rlm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.0.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "claude-agent-sdk>=0.1.0",
    "lxml>=5.0.0",
    "openai>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/arkaigrowth/rlm"
Repository = "https://github.com/arkaigrowth/rlm"
Issues = "https://github.com/arkaigrowth/rlm/issues"
Paper = "https://arxiv.org/abs/2512.24601"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
rlm-server = "src.rlm_mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
